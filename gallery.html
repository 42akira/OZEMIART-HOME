<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OZEMI</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="home-bar">
        <div id="logo">
            <img src="images/svg/logo-schwarz.svg" alt="OZEMI">
        </div>
        <div id="page-links">
            <a href="index.html">HOME</a>
            <a href="gallery.html">GALLERY</a>
            <a href="projects.html">PROJECTS</a>
            <a href="about.html">ABOUT</a>
        </div>

    </div>


    <style>
        /* === Das Herzstück: Multi-Column-Layout === */
        .gallery {
            display: flex;
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 2vw 4vw;
        }

        .gallery-column {
            display: flex;
            flex-direction: column;
            gap: 16px;
            flex: 1;
            /* alle Spalten gleich breit */
        }

        .gallery-item {

            margin-bottom: 0;
            border-radius: 8px;
            overflow: hidden;

            /* Start-Zustand für die Animation */
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .gallery-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-item img {
            width: 100%;
            display: block;
        }

        /* Bei schmalen Bildschirmen weniger Spalten */
        @media (max-width: 700px) {
            .gallery {
                column-count: 2;
            }
        }

        @media (max-width: 420px) {
            .gallery {
                column-count: 1;
            }
        }

        .gallery-item img {
            cursor: zoom-in;
        }

        /* === Lightbox === */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            /* wird per JS auf "flex" gesetzt */
            align-items: center;
            justify-content: center;
            z-index: 1000;
            overflow: hidden;
            /* falls reingezoomt wird, nicht scrollbar machen */
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 85vw;
            max-height: 85vh;
            object-fit: contain;
            /* scale wird per JS in transform gesetzt, transition macht das weich */
            transition: transform 0.15s ease-out;
            cursor: grab;
            user-select: none;
        }

        .lightbox-close,
        .lightbox-prev,
        .lightbox-next {
            position: absolute;
            background: none;
            border: none;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            padding: 10px 20px;
            line-height: 1;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .lightbox-close:hover,
        .lightbox-prev:hover,
        .lightbox-next:hover {
            opacity: 1;
        }

        .lightbox-close {
            top: 10px;
            right: 10px;
            font-size: 2rem;
        }

        .lightbox-prev {
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .lightbox-next {
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .lightbox-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            opacity: 0.7;
            font-size: 0.9rem;
        }
    </style>


    <div class="gallery" id="gallery"></div>


    <!-- Lightbox-Overlay: existiert nur einmal, Bild wird per JS ausgetauscht -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close">&times;</button>
        <button class="lightbox-prev" id="lightbox-prev">&#10094;</button>
        <img id="lightbox-img" src="" alt="">
        <button class="lightbox-next" id="lightbox-next">&#10095;</button>
        <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>



    <script>


        // Deine Bildpfade in der gewünschten Lese-Reihenfolge (Zeile für Zeile)
        const images = [
            { thumb: "images/gallery/fully_rendered/thumbs/plantmorning.jpg", full: "images/gallery/fully_rendered/plantmorning.png" },
            { thumb: "images/gallery/fully_rendered/thumbs/oktav_lounge.jpg", full: "images/gallery/fully_rendered/oktav_lounge.jpg" },
            { thumb: "images/gallery/fully_rendered/thumbs/raf_lounge.jpg", full: "images/gallery/fully_rendered/raf_lounge.jpg" },

            { thumb: "images/gallery/fully_rendered/thumbs/elias_car.jpg", full: "images/gallery/fully_rendered/elias_car.jpg" },
            { thumb: "images/gallery/fully_rendered/thumbs/istery_coffee.jpg", full: "images/gallery/fully_rendered/istery_coffee.jpg" },
            { thumb: "images/gallery/fully_rendered/thumbs/max_sleep.jpg", full: "images/gallery/fully_rendered/max_sleep.jpg" },

            { thumb: "images/gallery/fully_rendered/thumbs/moto_gemalde.jpg", full: "images/gallery/fully_rendered/moto_gemalde.jpg" },
            { thumb: "images/gallery/fully_rendered/thumbs/rooftop.jpg", full: "images/gallery/fully_rendered/rooftop.jpg" },
            { thumb: "images/gallery/fully_rendered/thumbs/throne.jpg", full: "images/gallery/fully_rendered/throne.jpg" },

            { thumb: "images/gallery/fully_rendered/thumbs/mountains_1.jpg", full: "images/gallery/fully_rendered/mountains_1.jpg" },
            { thumb: "images/gallery/fully_rendered/thumbs/mountains_2.jpg", full: "images/gallery/fully_rendered/mountains_2.jpg" },
            { thumb: "images/gallery/fully_rendered/thumbs/mountains_3.jpg", full: "images/gallery/fully_rendered/mountains_3.jpg" },
            { thumb: "images/gallery/fully_rendered/thumbs/mountains_4.jpg", full: "images/gallery/fully_rendered/mountains_4.jpg" },
            { thumb: "images/gallery/fully_rendered/thumbs/mountains_5.jpg", full: "images/gallery/fully_rendered/mountains_5.jpg" },
            { thumb: "images/gallery/fully_rendered/thumbs/mountains_6.jpg", full: "images/gallery/fully_rendered/mountains_6.jpg" },
            { thumb: "images/gallery/fully_rendered/thumbs/mountains_7.jpg", full: "images/gallery/fully_rendered/mountains_7.jpg" },
            { thumb: "images/gallery/fully_rendered/thumbs/mountains_8.jpg", full: "images/gallery/fully_rendered/mountains_8.jpg" },

            { thumb: "images/gallery/middle-sketch/thumbs/blush_sign.jpg", full: "images/gallery/middle-sketch/blush_sign.jpg" },
            { thumb: "images/gallery/middle-sketch/thumbs/sign_redraw_chess_1.jpg", full: "images/gallery/middle-sketch/sign_redraw_chess_1.jpg" },
            { thumb: "images/gallery/middle-sketch/thumbs/sign_redraw_chess_2.jpg", full: "images/gallery/middle-sketch/sign_redraw_chess_2.jpg" },
            { thumb: "images/gallery/middle-sketch/thumbs/white_raf_art.jpg", full: "images/gallery/middle-sketch/white_raf_art.png" },
        ];
        const gallery = document.getElementById('gallery');



        function getColumnCount() {
            if (window.innerWidth <= 420) return 1;
            if (window.innerWidth <= 700) return 2;
            return 3;
        }



        function buildGallery() {
            const columnCount = getColumnCount();
            gallery.innerHTML = ''; // alte Spalten leeren

            // N leere Spalten-Container erstellen
            const columns = [];
            for (let i = 0; i < columnCount; i++) {
                const col = document.createElement('div');
                col.className = 'gallery-column';
                gallery.appendChild(col);
                columns.push(col);
            }

            // Bilder reihenweise verteilen: index % columnCount entscheidet die Spalte
            images.forEach((item, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'gallery-item';

                const img = document.createElement('img');
                img.src = item.thumb;
                img.loading = "lazy"
                img.decoding = "async"

                img.addEventListener('click', () => openLightbox(index));

                wrapper.appendChild(img);
                columns[index % columnCount].appendChild(wrapper);


                observer.observe(wrapper); // Scroll-Animation aktivieren
            });
        }

        const observer = new IntersectionObserver((entries) => {
            const visibleNow = entries.filter(entry => entry.isIntersecting);

            visibleNow.forEach((entry, i) => {
                entry.target.style.transitionDelay = Math.min(i * 0.12, 0.5) + 's';
                entry.target.classList.add('visible');
                observer.unobserve(entry.target);
            });
        }, { threshold: 0.15 });



        let currentColumnCount = getColumnCount();

        buildGallery();

        window.addEventListener('resize', () => {
            const newCount = getColumnCount();
            if (newCount !== currentColumnCount) {
                currentColumnCount = newCount;
                buildGallery();
            }
        });











        // ===== Lightbox-Logik =====

        // Alle Bild-URLs der Galerie in ein Array packen, damit wir "vor/zurück" wissen


        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCounter = document.getElementById('lightbox-counter');
        const btnClose = document.getElementById('lightbox-close');
        const btnPrev = document.getElementById('lightbox-prev');
        const btnNext = document.getElementById('lightbox-next');

        let currentIndex = 0;
        let zoomScale = 1; // aktueller Zoom-Faktor




        function openLightbox(index) {
            currentIndex = index;
            zoomScale = 1;
            updateLightboxImage();
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        function updateLightboxImage() {
            const item = images[currentIndex]

            lightboxImg.src = item.thumb
            lightboxImg.style.transform = 'scale(1)';
            zoomScale = 1;


            // Original im Hintergrund laden und austauschen, wenn fertig
            const full = new Image();
            full.onload = () => {
                if (images[currentIndex] === item) {   // nur, wenn man nicht schon weitergeklickt hat
                    lightboxImg.src = item.full;
                }
            };
            full.src = item.full;




            lightboxCounter.textContent = (currentIndex + 1) + ' / ' + images.length;
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % images.length; // springt am Ende wieder zu 0
            updateLightboxImage();
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            updateLightboxImage();
        }


        btnClose.addEventListener('click', closeLightbox);
        btnNext.addEventListener('click', showNext);
        btnPrev.addEventListener('click', showPrev);

        // Klick auf den dunklen Hintergrund (nicht aufs Bild) schließt auch
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        // Tastatur-Steuerung: Pfeiltasten + Escape
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return; // nur wenn Lightbox offen ist
            if (e.key === 'ArrowRight') showNext();
            if (e.key === 'ArrowLeft') showPrev();
            if (e.key === 'Escape') closeLightbox();
        });

        // Zoomen mit dem Mausrad
        lightboxImg.addEventListener('wheel', (e) => {
            e.preventDefault(); // verhindert, dass die Seite dahinter mitscrollt

            const zoomStep = 0.1;
            if (e.deltaY < 0) {
                zoomScale += zoomStep; // Rad nach oben = reinzoomen
            } else {
                zoomScale -= zoomStep; // Rad nach unten = rauszoomen
            }

            // Zoom-Grenzen, damit man nicht ins Negative oder absurd groß zoomt
            zoomScale = Math.min(Math.max(zoomScale, 0.5), 4);

            lightboxImg.style.transform = `scale(${zoomScale})`;
        }, { passive: false }); // passive:false nötig, damit preventDefault() greift

        //against context menu clickable on img 

        document.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>



</body>

</html>
