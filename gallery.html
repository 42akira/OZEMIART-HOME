<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="home-bar">
        <div id="logo">
            <img src="images/svg/logo-schwarz.svg" alt="OZEMI">
        </div>
        <div id="page-links">
            <a href="index.html">HOME</a>
            <a href="gallery.html">GALLERY</a>
            <a href="projects.html">PROJECTS</a>
            <a href="about.html">ABOUT</a>
        </div>

    </div>


    <style>
        img {
            -webkit-user-drag: none;
            /* kein Drag-and-Drop auf den Desktop */
            user-select: none;
        }


        /* === Das Herzstück: Multi-Column-Layout === */
        .gallery {
            column-count: 3;
            /* 3 Spalten */
            column-gap: 16px;
            /* Abstand zwischen den Spalten */
            max-width: 1000px;
            margin: 0 auto;
            padding: 2vw 5vw;
        }

        .gallery-item {
            break-inside: avoid;
            /* verhindert, dass ein Bild über 2 Spalten zerschnitten wird */
            margin-bottom: 16px;
            border-radius: 8px;
            overflow: hidden;

            /* Start-Zustand für die Animation */
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 0.6s ease, transform 0.6s ease;
        }

        .gallery-item.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .gallery-item img {
            width: 100%;
            display: block;
        }

        /* Bei schmalen Bildschirmen weniger Spalten */
        @media (max-width: 700px) {
            .gallery {
                column-count: 2;
            }
        }

        @media (max-width: 420px) {
            .gallery {
                column-count: 1;
            }
        }

        .gallery-item img {
            cursor: zoom-in;
        }

        /* === Lightbox === */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            /* wird per JS auf "flex" gesetzt */
            align-items: center;
            justify-content: center;
            z-index: 1000;
            overflow: hidden;
            /* falls reingezoomt wird, nicht scrollbar machen */
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 85vw;
            max-height: 85vh;
            object-fit: contain;
            /* scale wird per JS in transform gesetzt, transition macht das weich */
            transition: transform 0.15s ease-out;
            cursor: grab;
            user-select: none;
        }

        .lightbox-close,
        .lightbox-prev,
        .lightbox-next {
            position: absolute;
            background: none;
            border: none;
            color: white;
            font-size: 2.5rem;
            cursor: pointer;
            padding: 10px 20px;
            line-height: 1;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .lightbox-close:hover,
        .lightbox-prev:hover,
        .lightbox-next:hover {
            opacity: 1;
        }

        .lightbox-close {
            top: 10px;
            right: 10px;
            font-size: 2rem;
        }

        .lightbox-prev {
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .lightbox-next {
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .lightbox-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            opacity: 0.7;
            font-size: 0.9rem;
        }
    </style>


    <div class="gallery">
        <!-- Bilder unterschiedlicher Höhe -> daher der "versetzte" Effekt -->
        <div class="gallery-item"><img src="images/gallery/atem1.jpg"></div>
        <div class="gallery-item"><img src="images/gallery/atem2.jpg" alt=""></div>
        <div class="gallery-item"><img src="images/gallery/blush.jpg" alt=""></div>
        <div class="gallery-item"><img src="images/gallery/pharao_sleep.jpg" alt=""></div>
        <div class="gallery-item"><img src="images/gallery/pharao_sleep_2.jpg" alt=""></div>
        <div class="gallery-item"><img src="images/gallery/plantmorning.png" alt=""></div>
        <div class="gallery-item"><img src="images/gallery/r_undercover_maf.png" alt=""></div>
        <div class="gallery-item"><img src="images/gallery/rafa_motor_poster.png" alt=""></div>
        <div class="gallery-item"><img src="images/gallery/Rafa_Profil.png" alt=""></div>
        <div class="gallery-item"><img src="images/gallery/Rafa_Profil_bg.png" alt=""></div>
        <div class="gallery-item"><img src="images/gallery/redraw chess logo1.png" alt=""></div>
        <div class="gallery-item"><img src="images/gallery/atem1.jpg" alt=""></div>
    </div>

    <!-- Lightbox-Overlay: existiert nur einmal, Bild wird per JS ausgetauscht -->
    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightbox-close">&times;</button>
        <button class="lightbox-prev" id="lightbox-prev">&#10094;</button>
        <img id="lightbox-img" src="" alt="">
        <button class="lightbox-next" id="lightbox-next">&#10095;</button>
        <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>



    <script>
        // Jedem Bild eine leichte, gestaffelte Verzögerung geben,
        // damit sie "nacheinander" statt alle gleichzeitig erscheinen.
        const items = document.querySelectorAll('.gallery-item');

        items.forEach((item, index) => {
            item.style.transitionDelay = (index % 4) * 0.1 + 's';
            // % 4, weil bei column-count:3 z.B. Item 0,3,6... eh in derselben Spalte
            // starten und dadurch nicht ewig aufeinander warten
        });

        // IntersectionObserver: beobachtet, wann ein Element in den Viewport scrollt
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target); // Animation nur einmal abspielen
                }
            });
        }, {
            threshold: 0.15 // löst aus, sobald 15% des Elements sichtbar sind
        });

        items.forEach(item => observer.observe(item));

        // ===== Lightbox-Logik =====

        // Alle Bild-URLs der Galerie in ein Array packen, damit wir "vor/zurück" wissen
        const galleryImages = Array.from(document.querySelectorAll('.gallery-item img'))
            .map(img => img.src);

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightbox-img');
        const lightboxCounter = document.getElementById('lightbox-counter');
        const btnClose = document.getElementById('lightbox-close');
        const btnPrev = document.getElementById('lightbox-prev');
        const btnNext = document.getElementById('lightbox-next');

        let currentIndex = 0;
        let zoomScale = 1; // aktueller Zoom-Faktor

        function openLightbox(index) {
            currentIndex = index;
            zoomScale = 1;
            updateLightboxImage();
            lightbox.classList.add('active');
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
        }

        function updateLightboxImage() {
            lightboxImg.src = galleryImages[currentIndex];
            lightboxImg.style.transform = 'scale(1)';
            zoomScale = 1;
            lightboxCounter.textContent = (currentIndex + 1) + ' / ' + galleryImages.length;
        }

        function showNext() {
            currentIndex = (currentIndex + 1) % galleryImages.length; // springt am Ende wieder zu 0
            updateLightboxImage();
        }

        function showPrev() {
            currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
            updateLightboxImage();
        }

        // Klick auf ein Galerie-Bild -> Lightbox öffnen an der richtigen Stelle
        document.querySelectorAll('.gallery-item img').forEach((img, index) => {
            img.addEventListener('click', () => openLightbox(index));
        });

        btnClose.addEventListener('click', closeLightbox);
        btnNext.addEventListener('click', showNext);
        btnPrev.addEventListener('click', showPrev);

        // Klick auf den dunklen Hintergrund (nicht aufs Bild) schließt auch
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) closeLightbox();
        });

        // Tastatur-Steuerung: Pfeiltasten + Escape
        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('active')) return; // nur wenn Lightbox offen ist
            if (e.key === 'ArrowRight') showNext();
            if (e.key === 'ArrowLeft') showPrev();
            if (e.key === 'Escape') closeLightbox();
        });

        // Zoomen mit dem Mausrad
        lightboxImg.addEventListener('wheel', (e) => {
            e.preventDefault(); // verhindert, dass die Seite dahinter mitscrollt

            const zoomStep = 0.1;
            if (e.deltaY < 0) {
                zoomScale += zoomStep; // Rad nach oben = reinzoomen
            } else {
                zoomScale -= zoomStep; // Rad nach unten = rauszoomen
            }

            // Zoom-Grenzen, damit man nicht ins Negative oder absurd groß zoomt
            zoomScale = Math.min(Math.max(zoomScale, 0.5), 4);

            lightboxImg.style.transform = `scale(${zoomScale})`;
        }, { passive: false }); // passive:false nötig, damit preventDefault() greift

        //against context menu clickable on img 

        document.addEventListener('contextmenu', (e) => e.preventDefault());
    </script>



</body>

</html>
